version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: seo-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=password
      - MONGO_INITDB_DATABASE=seo-platform
    restart: unless-stopped

volumes:
  mongodb_data:
